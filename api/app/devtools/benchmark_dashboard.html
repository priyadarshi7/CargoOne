<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POD Reader Benchmark</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--ink2:#4b5563;--ink3:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--bar:#cbd5e1;
--ok:#15803d;--ok-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--warn:#b45309;--warn-bg:#fef3c7;--info:#1d4ed8;--info-bg:#dbeafe;--mute-bg:#f1f5f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#f1f5f9;--ink2:#cbd5e1;--ink3:#94a3b8;--line:#25324a;--accent:#7aa2ff;--bar:#334155;
--ok:#4ade80;--ok-bg:#12331f;--bad:#f87171;--bad-bg:#3b1517;--warn:#fbbf24;--warn-bg:#3a2a0c;--info:#7aa2ff;--info-bg:#15264a;--mute-bg:#1a2438}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--ink:#f1f5f9;--ink2:#cbd5e1;--ink3:#94a3b8;--line:#25324a;--accent:#7aa2ff;--bar:#334155;
--ok:#4ade80;--ok-bg:#12331f;--bad:#f87171;--bad-bg:#3b1517;--warn:#fbbf24;--warn-bg:#3a2a0c;--info:#7aa2ff;--info-bg:#15264a;--mute-bg:#1a2438}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:28px 0 10px}
.sub{color:var(--ink3);font-size:13px;margin-top:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--ink2);padding:8px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.banner{margin:16px 0;padding:12px 16px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:center}
.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:30px;font-weight:700;margin-top:2px}.kpi .n{font-size:12px;color:var(--ink3)}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
.bars .r{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bars .t{height:12px;background:var(--mute-bg);border-radius:6px;overflow:hidden}.bars .f{height:100%;background:var(--accent);border-radius:6px}
.bars .f.low{background:var(--warn)}.bars .f.bad{background:var(--bad)}
.bars .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.pass{background:var(--ok-bg);color:var(--ok)}.chip.unsafe{background:var(--bad-bg);color:var(--bad)}.chip.friction{background:var(--warn-bg);color:var(--warn)}
.chip.different,.chip.error{background:var(--info-bg);color:var(--info)}.chip.dec{background:var(--mute-bg);color:var(--ink2);font-weight:500}.chip.tag{background:var(--mute-bg);color:var(--ink3);font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;align-items:center}
.filters button,.filters select,.filters input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:6px 12px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.case{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.case img{width:96px;height:128px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:var(--mute-bg)}
.case h3{font-size:15px;margin:0 0 3px}.case .do{font-size:13px;color:var(--ink3);margin:2px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.arrow{color:var(--ink3);font-size:12px}
.ticks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.tick{font-size:11px;border-radius:6px;padding:2px 6px;background:var(--mute-bg);color:var(--ink3)}
.tick.y{background:var(--ok-bg);color:var(--ok)}.tick.n{background:var(--bad-bg);color:var(--bad)}
details{margin-top:6px}summary{cursor:pointer;color:var(--accent);font-size:13px}
.det td:first-child{color:var(--ink3);width:130px}.det td.bad{color:var(--bad);font-weight:600}.det td.ok{color:var(--ok)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px}
.note{font-size:13px;color:var(--ink3)}.note b{color:var(--ink2)}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-align:left}.runinfo{margin:14px 0 0}
.empty{padding:30px;text-align:center;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>POD reader benchmark</h1><div class="sub" id="sub"></div></div>
    <div class="seg" id="models" role="group" aria-label="Model"></div>
  </div>
  <div id="app"></div>
</div>
<div class="lb" id="lb"><img alt="Photo"></div>
<script>
const DATA = /*DATA*/;
const THUMBS = /*THUMBS*/;
const FIELD_NAMES = {lr_no:'LR number',stamp:'Consignee stamp',signature:'Receiver signature',date:'Date received',quantity:'Quantity received',items:'Per-good lines',total:'Written total',remarks:'Remarks text',shortage_flag:'Shortage/damage flag'};
const STATUS = {pass:['✓','Pass'],unsafe:['✕','Unsafe'],friction:['!','Needless retake/review'],different:['~','Safe, but different'],error:['?','Model failed']};
const DEC = {verified:'verify',needs_review:'review',retake_requested:'retake'};
const FILTERS = [['all','All'],['pass','Pass'],['bad','Not passed'],['unsafe','Unsafe'],['friction','Needless retake/review'],['different','Safe, but different']];
let model = Object.keys(DATA).at(-1), filter = 'all', tag = '', q = '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (n, d) => d ? Math.round(1000 * n / d) / 10 : null;
const fmt = (p) => p === null ? 'n/a' : p + '%';
const cases = (m) => Object.entries(DATA[m].cases).map(([k, c]) => ({key: k, ...c})).sort((a, b) => a.sheet.localeCompare(b.sheet) || (a.cond === 'flat' ? -1 : b.cond === 'flat' ? 1 : a.cond.localeCompare(b.cond)));
const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };

function stats(m) {
  const cs = cases(m), n = cs.length, by = (s) => cs.filter((c) => c.status === s).length;
  const fields = {}; let ok = 0, app = 0;
  for (const f of Object.keys(FIELD_NAMES)) {
    const a = cs.filter((c) => c.fields[f] !== null && c.fields[f] !== undefined);
    const g = a.filter((c) => c.fields[f]).length; fields[f] = {ok: g, n: a.length}; ok += g; app += a.length;
  }
  const good = cs.filter((c) => c.expected.accept.includes('verified') && c.expected.decision === 'verified');
  const lat = cs.filter((c) => !c.error).map((c) => c.ms).sort((a, b) => a - b);
  const tags = {}; cs.forEach((c) => c.tags.forEach((t) => { (tags[t] ??= {ok: 0, n: 0}).n++; if (c.status === 'pass') tags[t].ok++; }));
  const conf = {}; cs.forEach((c) => { const k = c.expected.decision + '>' + c.decision; conf[k] = (conf[k] || 0) + 1; });
  return {n, pass: by('pass'), unsafe: by('unsafe'), friction: by('friction'), different: by('different'), error: by('error'), good: good.length, fields, fieldOk: ok, fieldN: app,
          median: median(lat), p95: lat[Math.min(lat.length - 1, Math.floor(lat.length * .95))] || 0, tags, conf, cs};
}
const bar = (label, ok, n) => { const p = pct(ok, n); return `<div class="r"><div>${esc(label)}</div><div class="t"><div class="f ${p !== null && p < 60 ? 'bad' : p !== null && p < 85 ? 'low' : ''}" style="width:${p ?? 0}%"></div></div><div class="v">${fmt(p)} (${ok}/${n})</div></div>`; };
const chip = (s) => `<span class="chip ${s}">${STATUS[s][0]} ${STATUS[s][1]}</span>`;
const dec = (d, cls = '') => `<span class="chip dec ${cls}">${esc(DEC[d] || d)}</span>`;
const sec = (s) => (s / 1000).toFixed(1) + ' s';

function overview(m) {
  const s = stats(m);
  const banner = s.unsafe === 0 ? `<div class="banner ok">✓ No unsafe errors: no sheet that should have been stopped would have been verified.</div>`
    : `<div class="banner bad">✕ ${s.unsafe} unsafe error${s.unsafe > 1 ? 's' : ''}: sheets that should not be verified would have been. Investigate these first (filter: Unsafe).</div>`;
  const kpi = (cls, l, v, n) => `<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  const fieldPct = pct(s.fieldOk, s.fieldN);
  let h = `<div class="card runinfo"><b>${esc(DATA[m].label)}</b><div class="note">${esc(DATA[m].model || '')} · ${esc(DATA[m].when || '')}<br>${esc(DATA[m].note || '')}</div></div>` + banner + `<div class="kpis">` +
    kpi(s.pass / s.n >= .85 ? 'ok' : 'warn', 'Decision pass rate', fmt(pct(s.pass, s.n)), `${s.pass} of ${s.n} photos got the expected decision`) +
    kpi(s.unsafe ? 'bad' : 'ok', 'Unsafe errors', s.unsafe, 'must be 0') +
    kpi(s.friction ? 'warn' : 'ok', 'Needless retakes / reviews', s.friction, `of ${s.good} good sheets`) +
    kpi(fieldPct >= 85 ? 'ok' : 'warn', 'Field accuracy', fmt(fieldPct), `${s.fieldOk} of ${s.fieldN} fields read right`) +
    kpi('', 'Time per photo', sec(s.median), `median; slowest 5%: ${sec(s.p95)}`) + `</div>`;
  h += `<h2>How each field was read</h2><div class="card bars">` + Object.entries(FIELD_NAMES).map(([f, l]) => s.fields[f].n ? bar(l, s.fields[f].ok, s.fields[f].n) : '').join('') + `</div>`;
  h += `<div class="cols"><div><h2>Pass rate by kind of test</h2><div class="card bars">` + Object.entries(s.tags).sort().map(([t, v]) => bar(t, v.ok, v.n)).join('') + `</div></div>`;
  const rows = ['verified', 'needs_review', 'retake_requested'], cols = ['verified', 'needs_review', 'retake_requested'];
  h += `<div><h2>What should happen vs what happened</h2><div class="card"><table><tr><th>Expected ↓ / Got →</th>${cols.map((c) => `<th class="num">${DEC[c]}</th>`).join('')}</tr>` +
    rows.map((r) => `<tr><td><b>${DEC[r]}</b></td>${cols.map((c) => { const v = s.conf[r + '>' + c] || 0; const cls = v && c === 'verified' && r !== 'verified' ? 'bad' : ''; return `<td class="num ${cls}">${v || '·'}</td>`; }).join('')}</tr>`).join('') +
    `</table><p class="note">Bottom-left matters most: a <b>retake</b> or <b>review</b> case that was <b>verified</b> is an unsafe error. Sheets where either answer is reasonable (judgement calls) count as a pass for both.</p></div></div></div>`;
  if (Object.keys(DATA).length > 1) h = compare() + h;
  return h + testSuite(s);
}

function compare() {
  const ms = Object.keys(DATA).map((m) => [m, stats(m)]);
  return `<h2>Model comparison</h2><div class="card"><table><tr><th>Run</th><th>Model</th><th>When</th><th class="num">Pass rate</th><th class="num">Unsafe</th><th class="num">Needless</th><th class="num">Field accuracy</th><th class="num">Median time</th><th class="num">Failed</th></tr>` +
    ms.map(([m, s]) => `<tr><td><button class="lnk" data-m="${m}"><b>${esc(DATA[m].label)}</b></button></td><td>${esc(DATA[m].model || '')}</td><td>${esc(DATA[m].when || '')}</td><td class="num">${fmt(pct(s.pass, s.n))}</td><td class="num" style="color:var(${s.unsafe ? '--bad' : '--ok'});font-weight:600">${s.unsafe}</td><td class="num">${s.friction}</td><td class="num">${fmt(pct(s.fieldOk, s.fieldN))}</td><td class="num">${sec(s.median)}</td><td class="num">${s.error}</td></tr>`).join('') + `</table></div>`;
}

function testSuite(s) {
  const alltags = [...new Set(s.cs.flatMap((c) => c.tags))].sort();
  const counts = {pass: s.pass, unsafe: s.unsafe, friction: s.friction, different: s.different};
  let h = `<h2>Test suite: every photo, labelled</h2><div class="filters" id="filters">` +
    FILTERS.map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter === k}">${l}${k === 'all' ? ` (${s.n})` : k === 'bad' ? ` (${s.n - s.pass})` : ` (${counts[k] ?? 0})`}</button>`).join('') +
    `<select id="tag" aria-label="Kind of test"><option value="">All kinds</option>${alltags.map((t) => `<option ${t === tag ? 'selected' : ''}>${t}</option>`).join('')}</select>` +
    `<input id="q" placeholder="Search S06, stamp, Hindi…" value="${esc(q)}" aria-label="Search"></div><div id="list"></div>`;
  return h;
}

function caseHtml(c) {
  const e = c.expected, g = c.got || {};
  const ticks = Object.entries(FIELD_NAMES).map(([f, l]) => { const v = c.fields[f]; return v === null || v === undefined ? '' : `<span class="tick ${v ? 'y' : 'n'}" title="${l}">${v ? '✓' : '✕'} ${l}</span>`; }).join('');
  const line = (l, exp, got, ok) => `<tr><td>${l}</td><td>${esc(exp)}</td><td class="${ok === undefined || ok === null ? '' : ok ? 'ok' : 'bad'}">${esc(got)}</td></tr>`;
  const yn = (b) => b ? 'present' : 'absent';
  const items = (g.items || []).map((i) => `${i.name || ''} ${i.quantity ?? '?'} ${i.unit || ''}`.trim()).join('; ');
  const detail = `<details><summary>Expected vs read</summary><table class="det"><tr><th></th><th>Expected</th><th>Read by the model</th></tr>` +
    line('LR number', e.lr, g.lr_no ?? '–', c.fields.lr_no) + line('Stamp', yn(e.stamp), yn(g.consignee_stamp_present), c.fields.stamp) + line('Signature', yn(e.signature), yn(g.signature_present), c.fields.signature) +
    line('Date', e.date || 'blank', g.delivery_date || 'blank', c.fields.date) + line('Quantity', e.quantity || 'blank', g.quantity_received || 'blank', c.fields.quantity) +
    (e.items.length ? line('Per-good', e.items.join(', '), items || '–', c.fields.items) + line('Total', e.total ?? '–', g.total_quantity || '–', c.fields.total) : '') +
    line('Remarks', e.remarks || 'none', g.remarks || 'none', c.fields.remarks) + line('Shortage flag', c.fields.shortage_flag === null ? '–' : '', g.shortage_or_damage ? 'yes' : 'no', c.fields.shortage_flag) +
    `<tr><td>Confidence</td><td></td><td>${g.confidence ?? '–'}${(g.issues || []).length ? ' · ' + esc(g.issues.join(', ')) : ''}</td></tr>` +
    (c.error ? `<tr><td>Error</td><td></td><td class="bad">${esc(c.error)}</td></tr>` : '') + `</table></details>`;
  return `<div class="case"><img src="${THUMBS[c.photo]}" alt="${esc(c.key)}" data-zoom="${esc(c.photo)}" loading="lazy"><div>
    <h3>${esc(c.sheet)}${c.cond !== 'flat' ? ' · ' + esc(c.cond) : ''} · ${esc(c.title)}</h3>
    <div class="do">Written by hand: ${esc(c.do)}</div>
    <div class="row">${chip(c.status)}<span class="arrow">expected</span>${e.accept.length > 1 ? e.accept.map((d) => dec(d)).join(' / ') : dec(e.decision)}<span class="arrow">got</span>${dec(c.decision, c.status === 'unsafe' ? 'bad' : '')}
      ${(c.reasons || []).map((r) => `<span class="chip tag">${esc(r.replaceAll('_', ' '))}</span>`).join('')}<span class="arrow">${sec(c.ms)}</span>
      ${c.judgement ? '<span class="chip tag">judgement call</span>' : ''}</div>
    <div class="row">${c.tags.map((t) => `<span class="chip tag">#${t}</span>`).join('')}</div>
    <div class="ticks">${ticks}</div>${detail}</div></div>`;
}

function list(m) {
  const cs = cases(m).filter((c) => (filter === 'all' || (filter === 'bad' ? c.status !== 'pass' : c.status === filter)) && (!tag || c.tags.includes(tag)) &&
    (!q || (c.key + ' ' + c.title + ' ' + c.do + ' ' + c.tags.join(' ')).toLowerCase().includes(q.toLowerCase())));
  $('#list').innerHTML = cs.length ? cs.map(caseHtml).join('') : '<div class="empty">No photos match these filters.</div>';
}

function render() {
  $('#sub').textContent = `${Object.keys(DATA).length} run(s) · ${cases(model).length} photographed sheets · sample data only, no real consignee details`;
  $('#models').innerHTML = Object.keys(DATA).map((m) => `<button data-m="${m}" aria-pressed="${m === model}">${esc(DATA[m].label)}</button>`).join('');
  $('#models').style.display = Object.keys(DATA).length > 1 ? '' : 'none';
  $('#app').innerHTML = overview(model) + `<p class="note" style="margin-top:22px"><b>How to read this.</b> The model only reads the photo; fixed rules decide. <b>Pass</b>: the app's decision is what a perfect reader would give. <b>Unsafe</b>: a sheet that should not be verified (missing stamp or signature, wrong LR, shortage or a different quantity) would have been verified. <b>Needless retake/review</b>: a good sheet sent back. <b>Safe, but different</b>: sent to a person where a retake was expected, or the reverse. Photo-condition shots and judgement calls accept more than one answer. This is a 28-photo check on printed sample sheets, not a measure of accuracy on a client's real PODs.</p><p class="note"><b>Add a model.</b> <code>python -m app.devtools.benchmark --photos ../docs/benchmark/photos --provider gemini --label gemini-run1 --title "Gemini 2.5 Flash · run 1"</code>, then <code>python -m app.devtools.benchmark_report</code>. It appears here as a new run beside the others (see docs/15-benchmark-forms.md).</p>`;
  list(model);
}
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.dataset.m) { model = t.dataset.m; render(); }
  else if (t.dataset.f) { filter = t.dataset.f; document.querySelectorAll('[data-f]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.f === filter)); list(model); }
  else if (t.dataset.zoom) { $('#lb img').src = THUMBS[t.dataset.zoom]; $('#lb').classList.add('on'); }
  else if (t.closest('#lb')) $('#lb').classList.remove('on');
});
document.addEventListener('change', (e) => { if (e.target.id === 'tag') { tag = e.target.value; list(model); } });
document.addEventListener('input', (e) => { if (e.target.id === 'q') { q = e.target.value; list(model); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#lb').classList.remove('on'); });
render();
</script>
</body>
</html>
